[package]
name = "lodestone_cli"
version = "1.0.6"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Native TLS (the default backend) is kept for the GitHub downloads of the installer. The
# API client builds its own rustls config (ring provider) for certificate pinning.
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "system-proxy", "json", "stream", "native-tls-vendored", "rustls-tls-manual-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0.0"
color-eyre = "0.6.2"
ctrlc = "3.2.5"
tokio = { version = "1.27.0", features = ["full"] }
semver = {version = "1.0.17", features = ["serde"]}
clap = { version = "4.2.7", features = ["derive"] }
ansi_term = "0.12.1"
indicatif = "0.17.3"
futures-util = "0.3.28"
tempfile = "3.5.0"
self_update = "0.37.0"
self-replace = "1.3.5"
# self_update still uses reqwest 0.11, whose header types come from http 0.2
http = "0.2"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12", "ring", "logging"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = "1.15.1"
ring = "0.17.14"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
rpassword = "7.4.0"
url = "2.5.8"
bytes = "1"

[dev-dependencies]
http-body-util = "0.1"
